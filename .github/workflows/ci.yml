name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Pytest
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
        run: |
          pytest tests/ -v
          
      - name: Run Static Security Scan
        run: |
          python3 scripts/custom_bandit.py
      
      - name: Setup dbt
        run: |
          pip install dbt-postgres
          cd dbt_telemetry
          dbt deps
      
      - name: Run dbt tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: aether_user
          POSTGRES_PASSWORD: aether_password
          POSTGRES_DB: aether_warehouse
          POSTGRES_PORT: 5432
        # Assuming a Postgres service is defined in the action (omitted for brevity)
        run: |
          cd dbt_telemetry
          dbt test

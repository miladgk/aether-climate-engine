name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aether_user
          POSTGRES_PASSWORD: aether_password
          POSTGRES_DB: aether_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Pytest
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
        run: |
          pytest tests/ -v
          
      - name: Run Static Security Scan
        run: |
          python3 scripts/custom_bandit.py
      
      - name: Validate dbt Project
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: aether_user
          POSTGRES_PASSWORD: aether_password
          POSTGRES_DB: aether_warehouse
          POSTGRES_PORT: 5432
        run: |
          cd dbt_telemetry
          dbt debug
          dbt deps

name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    # Pinned instead of ubuntu-latest: GitHub recently moved "latest" to a
    # brand-new Ubuntu release whose package names (libicu74, libxml2, etc.)
    # playwright's --with-deps installer doesn't know yet, breaking browser
    # install. ubuntu-24.04 is a stable LTS Playwright 1.48 fully supports.
    runs-on: ubuntu-24.04
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aether_user
          POSTGRES_PASSWORD: aether_password
          POSTGRES_DB: aether_warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Install Playwright Browsers (for E2E + cross-browser compatibility tests)
        run: |
          playwright install --with-deps chromium firefox webkit

      - name: Run Pytest
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          INTEGRATION_POSTGRES_HOST: localhost
          INTEGRATION_POSTGRES_PORT: 5432
          INTEGRATION_POSTGRES_USER: aether_user
          INTEGRATION_POSTGRES_PASSWORD: aether_password
          INTEGRATION_POSTGRES_DB: aether_warehouse
        run: |
          pytest tests/ -v
          
      - name: Run Static Security Scan
        run: |
          python3 scripts/custom_bandit.py

      - name: Run Dependency Vulnerability Scan
        # Advisory only: reports known CVEs in pinned dependencies without failing
        # the build, since bumping a pinned major framework version (e.g. Airflow)
        # is a deliberate, separate decision, not something a CI gate should force
        # on every push.
        run: |
          pip install pip-audit
          pip-audit || true

      - name: Validate dbt Project
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: aether_user
          POSTGRES_PASSWORD: aether_password
          POSTGRES_DB: aether_warehouse
          POSTGRES_PORT: 5432
        run: |
          cd dbt_telemetry
          dbt debug
          dbt deps

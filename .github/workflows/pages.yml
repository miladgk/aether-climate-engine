name: Deploy Aether dashboard

on:
  push:
    branches: [main]
    paths:
      # The pipeline's JSON outputs live in docs/; the UI source lives in web/.
      - "docs/*.json"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and unit-test dashboard
        working-directory: web
        run: |
          npm run typecheck
          npm test

      # vite build bundles the React app and copies docs/{sample_telemetry,
      # predictions,station_summary}.json next to index.html (see web/vite.config.ts).
      - name: Build dashboard
        working-directory: web
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

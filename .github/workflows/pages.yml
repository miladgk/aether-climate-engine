name: Deploy Aether Dashboard & Hourly Live Telemetry

on:
  push:
    branches: [main]
  schedule:
    # Runs hourly at minute 17 (off-peak minute avoiding top-of-hour congestion)
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Fast live fetcher: takes ~3 seconds, writes docs/live_latest.json
      # (git-ignored, so hourly refresh adds no commits to git history)
      - name: Fetch newest live weather readings
        continue-on-error: true
        run: |
          python3 scripts/fetch_live_readings.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and unit-test dashboard
        working-directory: web
        run: |
          npm run typecheck
          npm test

      # vite build bundles the React app and copies docs/{sample_telemetry,
      # predictions,station_summary,live_latest}.json next to index.html (see web/vite.config.ts).
      - name: Build dashboard
        working-directory: web
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

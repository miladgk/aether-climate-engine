name: Scheduled Weather Telemetry Ingestion

on:
  schedule:
    # Runs every 15 minutes (at minute 0, 15, 30, 45 of every hour)
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages and pushing updated snapshots
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Ingestion & ML Pipeline
        run: |
          PYTHONPATH=. python3 src/etl/extract_load.py

      - name: Commit and push updated snapshots to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sample_telemetry.json docs/predictions.json docs/station_summary.json
          git commit -m "chore(telemetry): auto-refresh live observations [skip ci]" || exit 0
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Dashboard with fresh telemetry
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

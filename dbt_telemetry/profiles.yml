dbt_telemetry:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'aether_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'aether_password') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'aether_warehouse') }}"
      schema: public
      threads: 4
      keepalives_idle: 0

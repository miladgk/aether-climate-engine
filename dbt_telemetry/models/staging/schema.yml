version: 2

models:
  - name: stg_weather_telemetry
    description: "Cleansed, typed, and standardized hourly weather telemetry from raw_telemetry."
    columns:
      - name: observation_time
        description: "Exact timestamp of the meteorological observation."
        tests:
          - not_null

      - name: observation_date
        description: "Calendar date of the observation."
        tests:
          - not_null

      - name: station_name
        description: "Name of the monitoring station (e.g. Berlin, Tokyo, New York, London, Sydney)."
        tests:
          - not_null
          - accepted_values:
              values: ['Berlin', 'Tokyo', 'New York', 'London', 'Sydney']
              quote: true

      - name: period
        description: "Telemetry period category: live (recent observed) or historical (YoY baseline)."
        tests:
          - not_null
          - accepted_values:
              values: ['live', 'historical']
              quote: true

      - name: temperature_c
        description: "Near-surface air temperature at 2m in Celsius."
        tests:
          - not_null

      - name: temperature_f
        description: "Near-surface air temperature at 2m in Fahrenheit."
        tests:
          - not_null

      - name: wind_speed_kmh
        description: "Wind speed at 10m in kilometers per hour."
        tests:
          - not_null

      - name: wind_speed_ms
        description: "Wind speed at 10m in meters per second."
        tests:
          - not_null

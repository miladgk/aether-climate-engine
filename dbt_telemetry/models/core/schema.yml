version: 2

models:
  - name: fct_daily_station_metrics
    description: "Core dimensional fact table aggregating hourly telemetry into daily climate indicators, temperature ranges, and extreme weather metrics per station."
    columns:
      - name: station_name
        description: "Name of the monitoring station."
        tests:
          - not_null

      - name: observation_date
        description: "Calendar date of the telemetry summary."
        tests:
          - not_null

      - name: period
        description: "Observation period (live vs historical YoY)."
        tests:
          - not_null

      - name: hourly_observations_count
        description: "Number of valid hourly telemetry readings recorded during the day."
        tests:
          - not_null

      - name: avg_temperature_c
        description: "Mean daily air temperature in Celsius."

      - name: min_temperature_c
        description: "Minimum recorded air temperature in Celsius."

      - name: max_temperature_c
        description: "Maximum recorded air temperature in Celsius."

      - name: diurnal_temperature_range_c
        description: "Daily temperature fluctuation range (max - min) in Celsius."

      - name: avg_wind_speed_kmh
        description: "Mean daily wind speed in km/h."

      - name: max_wind_speed_kmh
        description: "Peak wind speed gust in km/h."

      - name: freezing_hours_count
        description: "Total hours with temperatures at or below 0°C."

      - name: is_freezing_day
        description: "Binary flag (1 or 0) indicating whether any freezing occurred during the day."

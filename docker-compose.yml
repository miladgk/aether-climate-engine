version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aether_postgres
    environment:
      POSTGRES_USER: aether_user
      POSTGRES_PASSWORD: aether_password
      POSTGRES_DB: aether_warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: aether_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: aether_warehouse
      MB_DB_PORT: 5432
      MB_DB_USER: aether_user
      MB_DB_PASS: aether_password
      MB_DB_HOST: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:

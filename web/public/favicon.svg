<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Aether Observatory Favicon">
  <defs>
    <!-- Obsidian glass base -->
    <linearGradient id="bg-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191613" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>

    <!-- Warm amber + cool wind atmospheric auras -->
    <radialGradient id="aura-amber" cx="24%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aura-wind" cx="82%" cy="82%" r="58%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Rim light gradient -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.58" />
      <stop offset="48%" stop-color="#e8e0d4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45" />
    </linearGradient>

    <!-- Observed temperature wave gradient -->
    <linearGradient id="temp-stroke" x1="10" y1="42" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Subtle warm area under observed wave -->
    <linearGradient id="temp-fill" x1="0" y1="22" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- Forecast horizon emerald gradient -->
    <linearGradient id="fcst-stroke" x1="39" y1="26" x2="55" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Wind streamline cyan gradient -->
    <linearGradient id="wind-stroke" x1="12" y1="46" x2="54" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.4" />
    </linearGradient>

    <!-- Beacon glow -->
    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <clipPath id="squircle-clip">
      <rect x="2" y="2" width="60" height="60" rx="15" />
    </clipPath>
  </defs>

  <!-- Squircle container -->
  <g clip-path="url(#squircle-clip)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg-base)" />
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#aura-amber)" />
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#aura-wind)" />

    <!-- Planetary orbital ring & subtle meridian arc -->
    <circle
      cx="32"
      cy="32"
      r="21.5"
      fill="none"
      stroke="#f3ede2"
      stroke-opacity="0.11"
      stroke-width="1.3"
    />
    <path
      d="M 14 21 A 23 11 -16 0 1 51 19"
      fill="none"
      stroke="#fbbf24"
      stroke-opacity="0.26"
      stroke-width="1.2"
      stroke-linecap="round"
    />

    <!-- Vertical NOW Meridian hairline -->
    <line
      x1="39"
      y1="11"
      x2="39"
      y2="53"
      stroke="#f59e0b"
      stroke-opacity="0.32"
      stroke-width="1.25"
      stroke-dasharray="2.5 2.5"
    />

    <!-- Soft thermal fill under observed curve -->
    <path
      d="M 10 40 C 15 41, 18 30, 24 31 C 29 32, 32 36, 39 24 L 39 46 L 10 46 Z"
      fill="url(#temp-fill)"
    />

    <!-- Atmospheric wind streamline -->
    <path
      d="M 12 46.5 C 21 43, 30 48, 39 43.5 C 45 40.5, 49 41.5, 53.5 39.5"
      fill="none"
      stroke="url(#wind-stroke)"
      stroke-width="2.7"
      stroke-linecap="round"
    />

    <!-- Forecast horizon emerald trajectory -->
    <path
      d="M 39 24 C 44 19, 48.5 23, 54 17.5"
      fill="none"
      stroke="url(#fcst-stroke)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-dasharray="5.2 3.8"
    />

    <!-- Observed telemetry amber curve -->
    <path
      d="M 10 40 C 15 41, 18 30, 24 31 C 29 32, 32 36, 39 24"
      fill="none"
      stroke="url(#temp-stroke)"
      stroke-width="4.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Luminous NOW Beacon -->
    <circle cx="39" cy="24" r="9.5" fill="url(#beacon-glow)" />
    <circle cx="39" cy="24" r="4.3" fill="#f59e0b" />
    <circle cx="39" cy="24" r="2.1" fill="#fffbeb" />
  </g>

  <!-- Crisp metallic glass border -->
  <rect
    x="2.6"
    y="2.6"
    width="58.8"
    height="58.8"
    rx="14.4"
    fill="none"
    stroke="url(#rim)"
    stroke-width="1.35"
  />
</svg>
